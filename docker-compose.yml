services:
  db:
    image: postgres:16-alpine
    container_name: wassalha_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wassalha
      POSTGRES_PASSWORD: wassalha_dev
      POSTGRES_DB: wassalha
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wassalha -d wassalha"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wassalha_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database — points to the db service inside Docker network
      DATABASE_URL: postgresql://wassalha:wassalha_dev@db:5432/wassalha

      # Clerk — replace with real keys for full auth support
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_aGVyb2ljLW1vbmtleS00OC5jbGVyay5hY2NvdW50cy5kZXYk}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_placeholder_replace_with_real_key}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-whsec_placeholder_replace_with_real_key}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /dashboard
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /onboarding

      # External services — override from .env or environment
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-placeholder}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://placeholder.supabase.co}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-placeholder}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-placeholder}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_placeholder}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Wassalha <onboarding@resend.dev>}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-phc_placeholder}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-https://placeholder.upstash.io}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-placeholder}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BPlaceholder=}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-Placeholder=}
      VAPID_SUBJECT: mailto:admin@wassalha.ma
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-BPlaceholder=}
      CRON_SECRET: ${CRON_SECRET:-placeholder_cron_secret_min_32_chars_long}
      NODE_ENV: production

volumes:
  postgres_data:
